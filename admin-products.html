<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Inventory Manager | Hafeez Toy Store Admin</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <!-- Password Auth Overlay -->
  <div id="auth-gate" class="admin-auth-overlay">
    <div class="admin-auth-card">
      <div style="font-size:3rem; margin-bottom:12px;">🧸</div>
      <h2 style="font-family:var(--admin-heading); font-size:1.6rem; color:#FFF; margin-bottom:6px;">Hafeez Toy Store</h2>
      <p style="color:var(--admin-text-muted); font-size:0.9rem; margin-bottom:24px;">Admin Access Gate</p>
      
      <form onsubmit="handleAdminLogin(event)">
        <div style="margin-bottom:20px; text-align:left;">
          <label style="font-size:0.8rem; font-weight:700; color:var(--admin-text-muted); text-transform:uppercase;">Password</label>
          <input type="password" id="admin-pass-input" class="admin-input" placeholder="Enter ABDULLAH" required style="padding:12px 16px; font-size:1rem; text-align:center;">
        </div>
        <button type="submit" class="admin-btn admin-btn-primary" style="width:100%; justify-content:center; padding:12px; font-size:1rem;">
          Unlock Dashboard 🔓
        </button>
      </form>
    </div>
  </div>

  <!-- Admin Layout -->
  <div class="admin-layout" id="admin-app" style="display:none;">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <div class="admin-logo-box">🧸</div>
        <div>
          <span class="sidebar-brand-name">Hafeez Toys</span>
          <span class="sidebar-brand-tag">ADMIN</span>
        </div>
      </div>

      <nav style="display:flex; flex-direction:column; flex:1;">
        <span class="sidebar-section-label">Management</span>
        <a href="admin.html" class="sidebar-link">
          <span>📊</span>
          <span>Dashboard</span>
        </a>
        <a href="admin-products.html" class="sidebar-link active">
          <span>🧸</span>
          <span>Products & Stock</span>
        </a>
        <a href="admin-orders.html" class="sidebar-link">
          <span>📦</span>
          <span>Orders</span>
        </a>
        <a href="admin-customers.html" class="sidebar-link">
          <span>👥</span>
          <span>Inquiries & Subs</span>
        </a>

        <span class="sidebar-section-label">Storefront</span>
        <a href="index.html" target="_blank" class="sidebar-link" style="color:var(--admin-cyan);">
          <span>🌐</span>
          <span>Live Storefront ↗</span>
        </a>

        <div style="margin-top:auto; padding-top:20px; border-top:1px solid var(--admin-border);">
          <button onclick="adminLogout()" class="admin-btn admin-btn-danger" style="width:100%; justify-content:center;">
            Log Out 🔒
          </button>
        </div>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar-title">
          <span>Toy Product Inventory</span>
        </div>
        <div class="admin-topbar-actions">
          <button onclick="openAddModal()" class="admin-btn admin-btn-primary">
            <span>+ Add New Toy 🧸</span>
          </button>
        </div>
      </header>

      <div class="admin-content">
        <!-- Search & Filter Bar -->
        <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:24px; flex-wrap:wrap;">
          <input type="text" id="admin-search-input" class="admin-input" placeholder="Search toys by name or SKU..." style="max-width:320px;" oninput="handleAdminSearch(this.value)">
          <div style="display:flex; gap:10px;">
            <select id="admin-cat-filter" class="admin-select" style="width:auto;" onchange="filterAdminCategory(this.value)">
              <option value="all">All 8 Categories</option>
              <option value="Cars & Vehicles">Cars & Vehicles</option>
              <option value="Dolls">Dolls</option>
              <option value="Action Figures">Action Figures</option>
              <option value="Remote Control Toys">Remote Control Toys</option>
              <option value="Educational Toys">Educational Toys</option>
              <option value="Board Games">Board Games</option>
              <option value="Soft Toys">Soft Toys</option>
              <option value="Outdoor Toys">Outdoor Toys</option>
            </select>
          </div>
        </div>

        <!-- Products Table -->
        <div class="admin-card-section">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Toy & SKU</th>
                <th>Category</th>
                <th>Price (PKR)</th>
                <th>Discount Price</th>
                <th>Stock</th>
                <th>Badge</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-products-tbody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ADD / EDIT TOY PRODUCT MODAL -->
  <div id="product-modal" class="admin-modal-overlay">
    <div class="admin-modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--admin-border); padding-bottom:12px;">
        <h3 id="modal-title" style="font-family:var(--admin-heading); font-size:1.4rem;">Add New Toy Product</h3>
        <button onclick="closeProductModal()" style="background:none; border:none; color:#FFF; font-size:1.4rem; cursor:pointer;">✕</button>
      </div>

      <form id="product-form" onsubmit="handleProductFormSubmit(event)">
        <input type="hidden" id="prod-id">

        <div style="margin-bottom:14px;">
          <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">Toy Product Name *</label>
          <input type="text" id="prod-name" class="admin-input" placeholder="e.g. High-Speed 4WD Monster Truck" required>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;">
          <div>
            <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">Category *</label>
            <select id="prod-category" class="admin-select" required>
              <option value="Cars & Vehicles">Cars & Vehicles</option>
              <option value="Dolls">Dolls</option>
              <option value="Action Figures">Action Figures</option>
              <option value="Remote Control Toys">Remote Control Toys</option>
              <option value="Educational Toys">Educational Toys</option>
              <option value="Board Games">Board Games</option>
              <option value="Soft Toys">Soft Toys</option>
              <option value="Outdoor Toys">Outdoor Toys</option>
            </select>
          </div>
          <div>
            <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">SKU Code</label>
            <input type="text" id="prod-sku" class="admin-input" placeholder="e.g. HTS-RC-01">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;">
          <div>
            <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">Original Price in PKR *</label>
            <input type="number" id="prod-price" class="admin-input" placeholder="e.g. 4500" required>
          </div>
          <div>
            <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">Discounted Price in PKR (Optional)</label>
            <input type="number" id="prod-discount" class="admin-input" placeholder="e.g. 3499">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;">
          <div>
            <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">Stock Quantity *</label>
            <input type="number" id="prod-stock" class="admin-input" placeholder="e.g. 25" required>
          </div>
          <div>
            <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">Badge Label (e.g. BESTSELLER, HOT DEAL, NEW)</label>
            <input type="text" id="prod-badge" class="admin-input" placeholder="BESTSELLER">
          </div>
        </div>

        <div style="margin-bottom:14px;">
          <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">Product Image URL *</label>
          <input type="url" id="prod-image" class="admin-input" placeholder="https://images.unsplash.com/..." required>
        </div>

        <div style="margin-bottom:14px;">
          <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">Recommended Age Group</label>
          <input type="text" id="prod-age" class="admin-input" placeholder="e.g. 3-8 Years">
        </div>

        <div style="margin-bottom:20px;">
          <label style="font-size:0.82rem; font-weight:700; color:var(--admin-text-muted);">Toy Description & Safety Features</label>
          <textarea id="prod-desc" class="admin-textarea" rows="3" placeholder="Describe materials, accessories, scale, batteries..."></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px;">
          <button type="button" onclick="closeProductModal()" class="admin-btn admin-btn-secondary">Cancel</button>
          <button type="submit" class="admin-btn admin-btn-primary">Save Toy Product 💾</button>
        </div>
      </form>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script>
    let productsList = [];
    let currentCategoryFilter = 'all';

    function checkAuth() {
      if (window.HTSSupabase.isAdminAuthenticated()) {
        document.getElementById('auth-gate').style.display = 'none';
        document.getElementById('admin-app').style.display = 'flex';
        loadProductsTable();
      } else {
        document.getElementById('auth-gate').style.display = 'flex';
        document.getElementById('admin-app').style.display = 'none';
      }
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('admin-pass-input').value;
      if (window.HTSSupabase.verifyAdminPassword(pass)) {
        window.HTSSupabase.setAdminAuthenticated(true);
        checkAuth();
        showToast('Admin Panel Unlocked!', 'success', '👑');
      } else {
        showToast('Incorrect password! Enter "ABDULLAH"', 'error', '🔒');
      }
    }

    function adminLogout() {
      window.HTSSupabase.setAdminAuthenticated(false);
      checkAuth();
    }

    async function loadProductsTable() {
      productsList = await window.HTSSupabase.fetchProducts();
      renderTable(productsList);
    }

    function renderTable(products) {
      const tbody = document.getElementById('admin-products-tbody');
      if (!tbody) return;

      tbody.innerHTML = products.map(p => `
        <tr>
          <td>
            <div style="display:flex; align-items:center; gap:12px;">
              <img src="${p.image_url}" alt="${p.name}" style="width:44px; height:44px; border-radius:10px; object-fit:cover; border:1px solid var(--admin-border);">
              <div>
                <strong style="color:#FFF; display:block;">${p.name}</strong>
                <small style="color:var(--admin-text-muted);">${p.sku || p.id}</small>
              </div>
            </div>
          </td>
          <td><span style="color:var(--admin-cyan); font-weight:600;">${p.category}</span></td>
          <td><strong style="color:#FFF;">Rs. ${(p.price).toLocaleString()}</strong></td>
          <td>${p.discount_price ? `<span style="color:var(--admin-amber); font-weight:700;">Rs. ${(p.discount_price).toLocaleString()}</span>` : '<span style="color:var(--admin-text-muted);">-</span>'}</td>
          <td>
            <span style="color:${p.stock > 10 ? 'var(--admin-green)' : 'var(--admin-amber)'}; font-weight:700;">
              ${p.stock} units
            </span>
          </td>
          <td>${p.badge ? `<span style="background:rgba(255,51,102,0.2); color:var(--admin-primary); padding:3px 8px; border-radius:6px; font-size:0.75rem; font-weight:800;">${p.badge}</span>` : '-'}</td>
          <td>
            <div style="display:flex; gap:8px;">
              <button onclick="openEditModal('${p.id}')" class="admin-btn admin-btn-secondary" style="padding:6px 12px; font-size:0.8rem;">Edit ✏️</button>
              <button onclick="handleDeleteProduct('${p.id}')" class="admin-btn admin-btn-danger" style="padding:6px 12px; font-size:0.8rem;">Delete 🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function handleAdminSearch(val) {
      const q = (val || '').toLowerCase();
      const filtered = productsList.filter(p => 
        (currentCategoryFilter === 'all' || p.category === currentCategoryFilter) &&
        (p.name.toLowerCase().includes(q) || (p.sku && p.sku.toLowerCase().includes(q)))
      );
      renderTable(filtered);
    }

    function filterAdminCategory(cat) {
      currentCategoryFilter = cat;
      const searchVal = document.getElementById('admin-search-input').value;
      handleAdminSearch(searchVal);
    }

    // Modal Operations
    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add New Toy Product';
      document.getElementById('product-form').reset();
      document.getElementById('prod-id').value = '';
      document.getElementById('product-modal').classList.add('active');
    }

    function openEditModal(productId) {
      const p = productsList.find(item => String(item.id) === String(productId) || String(item.sku) === String(productId));
      if (!p) return;

      document.getElementById('modal-title').textContent = `Edit Toy: ${p.name}`;
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-name').value = p.name;
      document.getElementById('prod-category').value = p.category;
      document.getElementById('prod-sku').value = p.sku || '';
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-discount').value = p.discount_price || '';
      document.getElementById('prod-stock').value = p.stock;
      document.getElementById('prod-badge').value = p.badge || '';
      document.getElementById('prod-image').value = p.image_url;
      document.getElementById('prod-age').value = p.age_range || '';
      document.getElementById('prod-desc').value = p.description || '';

      document.getElementById('product-modal').classList.add('active');
    }

    function closeProductModal() {
      document.getElementById('product-modal').classList.remove('active');
    }

    async function handleProductFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;

      const productData = {
        name: document.getElementById('prod-name').value.trim(),
        category: document.getElementById('prod-category').value,
        sku: document.getElementById('prod-sku').value.trim() || `HTS-${Date.now()}`,
        price: Number(document.getElementById('prod-price').value),
        discount_price: document.getElementById('prod-discount').value ? Number(document.getElementById('prod-discount').value) : null,
        stock: Number(document.getElementById('prod-stock').value),
        badge: document.getElementById('prod-badge').value.trim(),
        image_url: document.getElementById('prod-image').value.trim(),
        age_range: document.getElementById('prod-age').value.trim(),
        description: document.getElementById('prod-desc').value.trim()
      };

      if (id) {
        await window.HTSSupabase.updateProduct(id, productData);
      } else {
        await window.HTSSupabase.addProduct(productData);
      }

      closeProductModal();
      loadProductsTable();
    }

    async function handleDeleteProduct(id) {
      if (confirm('Are you sure you want to delete this toy product?')) {
        await window.HTSSupabase.deleteProduct(id);
        loadProductsTable();
      }
    }

    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
